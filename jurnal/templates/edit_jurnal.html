{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edit Jurnal</title>
    <!-- Konfigurasi PWA & Theme Mobile -->
    <meta name="theme-color" content="#6c5ce7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JurnalKu">
    <link rel="manifest" href="{% static 'jurnal/manifest.json' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #6c5ce7;
            --primary-purple-hover: #5649c0;
            --bg-light: #f8f9fd;
            --card-border: #edf0f7;
            --text-dark: #2d3436;
        }
        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding-bottom: 40px;
        }
        .navbar-mobile {
            background: #ffffff;
            border-bottom: 1px solid var(--card-border);
        }
        .app-card {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
        }
        .btn-primary-custom {
            background-color: var(--primary-purple);
            border-color: var(--primary-purple);
            color: #ffffff;
            border-radius: 12px;
            font-weight: 600;
        }
        .btn-primary-custom:hover {
            background-color: var(--primary-purple-hover);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <header class="navbar-mobile px-3 py-3 sticky-top">
        <div class="d-flex align-items-center gap-2">
            <a href="javascript:history.back()" class="btn btn-sm btn-light border rounded-circle" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;">
                <i class="bi bi-chevron-left text-dark"></i>
            </a>
            <h6 class="mb-0 fw-bold">Edit Jurnal</h6>
        </div>
    </header>

    <main class="container py-3">
        <div class="app-card p-3 p-md-4">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted">Tanggal</label>
                    {{ form.tanggal }}
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted">Nama Kegiatan</label>
                    {{ form.nama_kegiatan }}
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted">Kategori</label>
                    {{ form.kategori }}
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted">Catatan</label>
                    {{ form.catatan }}
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted">Foto Dokumentasi</label>
                    {% if jurnal.foto_dokumentasi %}
                    <div class="mb-2">
                        <img src="{{ jurnal.foto_dokumentasi.url }}" class="rounded-3" style="max-height: 120px;" alt="preview">
                    </div>
                    {% endif %}
                    {{ form.foto_dokumentasi }}
                </div>
                <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-2">
                    <i class="bi bi-check2"></i> Simpan Perubahan
                </button>
                <a href="javascript:history.back()" class="btn btn-light border w-100 py-2">Batal</a>

            </form>
        </div>
    </main>
    <!-- Registrasi PWA Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register("{% static 'jurnal/sw.js' %}")
                    .then(reg => console.log('PWA ServiceWorker terdaftar:', reg.scope))
                    .catch(err => console.log('PWA ServiceWorker gagal:', err));
            });
        }
    </script>
</body>
</body>
</html>
