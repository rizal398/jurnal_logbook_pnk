{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Masuk - Jurnal Harian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <meta name="theme-color" content="#6c5ce7">
    <link rel="manifest" href="{% static 'jurnal/manifest.json' %}">
    <style>
        :root {
            --primary-purple: #6c5ce7;
            --bg-light: #f8f9fd;
        }
        body {
            background-color: var(--bg-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.08);
            width: 100%;
            max-width: 400px;
            padding: 30px 24px;
        }
        .btn-primary-custom {
            background-color: var(--primary-purple);
            border: none;
            color: #ffffff;
            border-radius: 12px;
            font-weight: 600;
        }
        .btn-primary-custom:hover { background-color: #5649c0; color: #fff; }
    </style>
</head>
<body class="p-3">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="rounded-circle d-inline-flex align-items-center justify-content-center text-white mb-2" style="width: 50px; height: 50px; background: #6c5ce7; font-weight: bold; font-size: 1.4rem;">
                J
            </div>
            <h4 class="fw-bold mb-1">Masuk Akun</h4>
            <p class="text-muted small">Catat & rekap logbook harianmu</p>
        </div>

        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-danger py-2 small rounded-3">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted">Username / NIM</label>
                <input type="text" name="username" class="form-control" placeholder="Masukkan username" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-semibold text-muted">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Masukkan password" required>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">
                Masuk Sekarang
            </button>
        </form>

        <div class="text-center small text-muted">
            Belum punya akun? <a href="{% url 'register' %}" class="fw-bold text-decoration-none" style="color: var(--primary-purple);">Daftar di sini</a>
        </div>
    </div>
</body>
</html>
